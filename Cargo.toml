[workspace]
members = ["crates/prisma-dualsense-hid", "crates/prisma-dualsense-audio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[profile.release]
debug = true
lto = "thin"

# Third-party dependencies don't need debuginfo in dev builds (saves tens of GB of target/).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
